<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONEXÃO FASHION</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
background:#111;
padding:20px;
text-align:center;
border-bottom:2px solid gold;
}

.logo{
font-size:2rem;
font-weight:bold;
color:gold;
}

.banner{
padding:50px 20px;
text-align:center;
background:linear-gradient(to right,#000,#222);
}

.banner h1{
font-size:2.5rem;
color:gold;
}

.banner p{
margin-top:15px;
font-size:1.1rem;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:gold;
color:#000;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

section{
padding:40px 20px;
}

.titulo{
text-align:center;
margin-bottom:30px;
color:gold;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
  
.card{
background:#111;
padding:15px;
border-radius:12px;
border:1px solid #333;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin-top:10px;
}

.preco{
color:gold;
font-size:1.2rem;
margin-top:10px;
}

footer{
background:#111;
padding:20px;
text-align:center;
margin-top:40px;
border-top:2px solid gold;
}
</style>
</head>

<body>

<header>
<div class="logo">CONEXÃO FASHION</div>
</header>

<section class="banner">
<h1>Moda e Beleza para Você</h1>
<p>Maquiagens, bolsas, moda praia e muito mais.</p>

<a href="#" class="btn">
Ver Produtos
</a>
</section>

<section>
<h2 class="titulo">Novidades</h2>

<div class="produtos">

<div class="card">
<h3>Gloss Melu</h3>
<p class="preco">R$ 14,90</p>
</div>

<div class="card">
<h3>Pó Compacto</h3>
<p class="preco">R$ 22,90</p>
</div>

<div class="card">
<h3>Máscara de Cílios</h3>
<p class="preco">R$ 19,90</p>
</div>

</div>
</section>

<section>
<h2 class="titulo">Informações da Loja</h2>

<p style="text-align:center;">
Terminal Rodoviário João Goulart<br>
Centro - Niterói - RJ
</p>
</section>

<footer>
CONEXÃO FASHION © 2026
</footer>

</body>
</html>
